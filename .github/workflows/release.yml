name: Build offline documentation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site and offline package
        run: python build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: emx-docs-offline
          path: dist/emx-docs-offline.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/emx-docs-offline.zip --title "${{ github.ref_name }}" --generate-notes
